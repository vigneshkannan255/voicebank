<div class="content">
<div class="container">
{% for data in results %}
	<div class="artist">
        <img src={{data['profile_image']}} alt="Dubbing Artist" width="100" height="100">
        <div class="artist-info">
	    <h2>Name: {{data['first_name']}} {{data['last_name']}} <input type="checkbox" id="" name="" value="" style="float:right;transform:scale(1.5);margin:10px"> </h2>
            <p><span>Gender:</span> {{data['gender']}}</p>
            <p><span>Category:</span> {{data['category']}}</p>
            <p><span>Language:</span> {{data['language']}}</p>
	    <p><span>Slang:</span> {{data['slang']}}</p>
	    <div>
            <audio controls>
  	    <source src={{data['voice']}} type="audio/mpeg">
	    </audio>
	    </div>
        </div>
    </div>
{% endfor %}
</div>
</div>
