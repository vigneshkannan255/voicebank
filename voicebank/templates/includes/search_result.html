<div class="content">
    {% if results %}
    <div class="container text-center flex flex-wrap justify-center"> 
    {% for data in results %}
    <div class="artist bg-white mt-14 pb-5 rounded-3xl overflow-hidden shadow-lg mx-2 mb-4 flex flex-col justify-between"style="height: auto;width: 290px";>
		<div>
            <label class="inline-flex items-center" style="float:right;margin:10px">
                <input onclick="toggleCheckbox(this)" id="selected_profile_{{ loop.index }}" class="selected_profile hidden" type="checkbox" name="voice_{{ loop.index }}" value="{{data['member_id']}}">
                <span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="heartIcon w-6 h-6 cursor-pointer" id="heartIcon_{{ loop.index }}">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                    </svg>
                </span>
            </label>
        </div>
        
        <div class=" flex items-center justify-center"> 
            <img src={{data['voice_image']}} alt="Dubbing Artist" width="90" height="90">
        </div>
		
        <div class="artist-info px-4 ">
            <h4 class="mt-0 text-base text-GreenishBlue font-serif">Name: {{data['first_name']}} {{data['last_name']}} </h4>
			 <div class="text-base text-GreenishBlue font-serif">
                <div class="mb-1"><span>Gender:</span> {{data['gender']}}</div>
                <div class="mb-1"><span>Category:</span> {{data['category']}}</div>
                <div class="mb-1"><span>Language:</span> {{data['language']}}</div>
                <div class="mb-1"><span>Slang:</span> {{data['slang']}}</div>
            </div>
        </div>
        <div class="ml-5 mb-2 flex justify-center" style="height: 40px;width: 250px; ">
            <audio controls class="w-full"> 
                <source src={{data['voice']}} type="audio/mpeg">
            </audio>
        </div>
    </div>
    {% endfor %}  
    </div>
    {% else %}
    <div class="container text-center text-6xl text-GreenishBlue font-serif mt-8">
        <h1>No Search Found</h1>
    </div> 
    {% endif %}
</div>
<script>
    
    function toggleCheckbox(checkbox) {
        var heartIcon = checkbox.parentNode.querySelector('.heartIcon');
        if (checkbox.checked) {
            heartIcon.setAttribute('fill', '#FF007F');
        }
        else 
	{
            heartIcon.setAttribute('fill', 'currentColor');
        }

	var selectedCheckboxes = document.querySelectorAll('.selected_profile:checked');
	if(selectedCheckboxes.length > 0) {
            document.getElementById('openModalButton').classList.remove('hidden');
    	
	}
	else
	{
            document.getElementById('openModalButton').classList.add('hidden');
		
	} 
    }
</script>
