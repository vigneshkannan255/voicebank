<div class="content">
    {% if results %}
    <div class="container text-center flex flex-wrap justify-center"> 
    {% for data in results %}
    <div class="artist bg-white mt-14 h-96 w-96 pb-5 rounded-3xl overflow-hidden shadow-md mx-2 mb-4 flex flex-col justify-between">
		<div>
            <label class="inline-flex items-center" style="float:right;margin:10px">
                <input onclick="toggleCheckbox(this)" class="selected_profile hidden" type="checkbox" name="voice_{{ loop.index }}" value="{{data['member_id']}}">
                <span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 cursor-pointer" id="heartIcon">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                    </svg>
                </span>
            </label>
        </div>
        
        
        <div class="h-60 flex items-center justify-center"> 
            <img src={{data['voice_image']}} alt="Dubbing Artist" width="90" height="90">
        </div>
		
        <div class="artist-info px-4 py-2">
            <h4 class="mt-2 text-base text-GreenishBlue font-serif">Name: {{data['first_name']}} {{data['last_name']}} </h4>
			 <div class="text-base text-GreenishBlue font-serif">
                <p><span>Gender:</span> {{data['gender']}}</p>
                <p><span>Category:</span> {{data['category']}}</p>
                <p><span>Language:</span> {{data['language']}}</p>
                <p><span>Slang:</span> {{data['slang']}}</p>
            </div>
        </div>
        <div class="mt-2 flex justify-center">
            <audio controls class="w-full"> 
                <source src={{data['voice']}} type="audio/mpeg">
            </audio>
        </div>
    </div>
    {% endfor %}  
    </div>
    {% endif %}
</div>
<script>
    function toggleCheckbox(heart) {
        var checkbox = heart.parentNode.querySelector('.selected_profile');
        checkbox.checked = !checkbox.checked;
    }

    function toggleCheckbox(checkbox) {
        var heartIcon = checkbox.parentNode.querySelector('#heartIcon');
        if (checkbox.checked) {
            heartIcon.setAttribute('fill', '#FF007F');
        } else {
            heartIcon.setAttribute('fill', 'currentColor');
        }
    }
    
</script>
