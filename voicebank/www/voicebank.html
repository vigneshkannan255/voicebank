<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="voice.css">
<title>Dubbing Artist Information</title>
{% extends "templates/web.html" %}
</head>
<body>
<script>
var selectElement = document.getElementById("age");
var selectedOption = selectElement.options[selectElement.selectedIndex];
var values = selectedOption.value.split(",");
var min_age = parseInt(values[0]);
var max_age= parseInt(values[1]);
frappe.ready(function() {
	$('.btn-more').on('click', function() {
		frappe.call({
			method: 'voicebank.www.voicebank.search',
			args: {
				language: '{{ language }}',
				gender: '{{ gender }}',
				slang: '{{ slang }}',
				age: '{{ age }}'
			},
			callback: function(r) {
				$(r.message.results).appendTo('.search-result');
				$('.btn-more').toggleClass('hidden', !!!r.message.has_more);
			}
		});
	});
});
</script>
{% block content %}
<center>
<h2>Search Voice Artist</h2>
		<form action="">
				<select name="language" id="language">
                                <option value="">Select Language</option>
                                <option value="tamil">Tamil</option>
                                <option value="english">English</option>
                                <option value="Malayalam">Malayalam</option>
				<option value="hindi">Hindi</option>
				<option value="telugu">Telugu</option>
                                </select>

				<select name="gender" id="gender">
                                <option value="">Select Gender</option>
                                <option value="female">Female</option>
                                <option value="male">Male</option>
                                </select>
				
				<select name="slang" id="slang">
                                <option value="">Select Slang</option>
                                <option value="madurai">Madurai</option>
                                <option value="Madras">Madras</option>
				<option value="general">General</option>
                                </select>
				
			 	<select name="age" id="age">
                                <option value="">Select Age</option>
                                <option value="r1">5-10</option>
                                <option value="r2">10-15</option>
				<option value="r3">15-20</option>
				<option value="r4">20-25</option>
				<option value="r5">25-30</option>
				<option value="r6">30-35</option>
				<option value="r7">35-40</option>
				<option value="r8">40-45</option>
				<option value="r9">45-50</option>
                                </select> 
				
				

				
				<button type="submit" class="btn btn-sm btn-primary btn-search"> {{ _('Search') }} </button>
			{% if frappe.form_dict.scope %}
				<input type="text" hidden name="scope" value="{{ frappe.utils.escape_html(frappe.form_dict.scope) }}">
			{% endif %}
		</form>
    <h2>Enquiry Form</h2>

    <!-- Button to open the popup -->
    <button onclick="openPopup()">Open Enquiry Form</button>

    <!-- The popup form -->
    <div id="enquiryPopup" class="popup">
        <div class="popup-content">
            <span class="close" onclick="closePopup()">&times;</span>
            <h3>Enquiry Form</h3>
            <form action="/submit_enquiry" method="post">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" cols="50" required></textarea><br><br>

                <input type="submit" value="Submit">
            </form>
        </div>
    </div>

    <script>
        // Function to open the popup
        function openPopup() {
            document.getElementById("enquiryPopup").style.display = "block";
        }

        // Function to close the popup
        function closePopup() {
            document.getElementById("enquiryPopup").style.display = "none";
        }
    </script>


</center>
<div clas
s="search-result">
<form>
	{% include "voicebank/templates/includes/search_result.html" %}
</form>
</div>
{% endblock %}
</body>
</html>
